name: ptook
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State & DI
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  equatable: ^2.0.5
  dartz: ^0.10.1

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.7.1
  uuid: ^4.5.1
  share_plus: ^10.0.0
  # UI & Gamification
  fl_chart: ^1.2.0
  lottie: ^3.3.3
  google_fonts: ^8.1.0
  intl: ^0.20.2
  app_links: ^6.3.0
  internet_connection_checker: ^3.0.1
  shimmer: ^3.0.0
  http: ^1.6.0
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  google_mobile_ads: ^5.0.0
  flutter_native_splash: ^2.4.8
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.7.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/ptook_icon.png"
  min_sdk_android: 21


flutter_native_splash:
  color: "#000000"
  image: assets/icons/ptook_icon.png

  android: true
  ios: true
  web: true

  fullscreen: true

  android_12:
    color: "#000000"
    image: assets/icons/ptook_icon.png
    icon_background_color: "#000000"


flutter:
  uses-material-design: true

  assets:
    - assets/icons/ptook_icon.png